services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - appnet

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull ${CHAT_MODEL:-llama3.2:1b}
        ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - appnet

  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic} -h localhost -p ${POSTGRES_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  app:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
      DOCS_PATH: /docs
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:1b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8009:8000"
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./documents:/docs:ro
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5179:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - appnet

volumes:
  pgdata:
  ollama_data:

networks:
  appnet:
